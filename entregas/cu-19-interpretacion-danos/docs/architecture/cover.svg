<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CU-19 · Arquitectura de interpretación de daños</title>
  <desc id="desc">De la evidencia visual al informe trazable: visión, cálculo determinista, fuentes documentales y revisión humana.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1729"/>
      <stop offset="1" stop-color="#19394b"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5ee2bd"/>
      <stop offset="1" stop-color="#7bc7f2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94c2d6" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <path d="M960 0L1280 320M1080 0L1280 200" stroke="#6adbbf" stroke-opacity=".12" stroke-width="80"/>
  <rect x="48" y="42" width="192" height="30" rx="15" fill="#65dfbb" fill-opacity=".13" stroke="#65dfbb" stroke-opacity=".45"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="66" y="63" font-size="13" letter-spacing="2" fill="#9ef2d8" font-weight="700">CU-19 / PIIA2</text>
    <text x="48" y="133" font-size="44" font-weight="700" fill="#f4f9ff">De la imagen</text>
    <text x="48" y="188" font-size="44" font-weight="700" fill="url(#accent)">al informe trazable.</text>
    <text x="50" y="226" font-size="18" fill="#bcd0df">Arquitectura · Contratos · Evidencia · Decisiones</text>
    <line x1="48" y1="256" x2="1232" y2="256" stroke="#8ba8bc" stroke-opacity=".25"/>
    <text x="50" y="294" font-size="13" letter-spacing="1.4" fill="#8daabd">VISIÓN INTERPRETA</text>
    <text x="350" y="294" font-size="13" letter-spacing="1.4" fill="#8daabd">CÓDIGO CALCULA</text>
    <text x="650" y="294" font-size="13" letter-spacing="1.4" fill="#8daabd">FUENTES RESPALDAN</text>
    <text x="950" y="294" font-size="13" letter-spacing="1.4" fill="#8daabd">PERSONAS REVISAN</text>
    <text x="50" y="322" font-size="14" fill="#e6f1f8">Detecciones → hallazgos</text>
    <text x="350" y="322" font-size="14" fill="#e6f1f8">Dos escenarios económicos</text>
    <text x="650" y="322" font-size="14" fill="#e6f1f8">Póliza y legislación</text>
    <text x="950" y="322" font-size="14" fill="#e6f1f8">Markdown con sus límites</text>
    <g transform="translate(830 58)">
      <rect width="356" height="151" rx="16" fill="#0b1729" fill-opacity=".5" stroke="#5cdab9" stroke-opacity=".3"/>
      <path d="M32 89L74 47L120 98L164 60L208 85L250 39L304 64" fill="none" stroke="url(#accent)" stroke-width="3"/>
      <g fill="#19394b" stroke="#8cf0d2" stroke-width="3">
        <circle cx="32" cy="89" r="7"/><circle cx="120" cy="98" r="7"/>
        <circle cx="208" cy="85" r="7"/><circle cx="304" cy="64" r="7"/>
      </g>
      <text x="26" y="131" font-size="11" letter-spacing="1.6" fill="#adc6d7">EVIDENCIA → CONTEXTO → RESULTADO</text>
    </g>
  </g>
